name: Lyra Evening Post
on:
  workflow_dispatch:  # manual runs for testing
    inputs:
      dry_run:
        description: "Test only: print the post, don't send it"
        type: boolean
        default: true
      force:
        description: "Force: post even if today's post is flagged (only when the email says so)"
        type: boolean
        default: false
  schedule:
    # Every 10 min from 14:55 to 16:55 JST (13 tries). GitHub sometimes skips
    # scheduled runs; the first one that actually runs posts, the rest do nothing.
    - cron: "55 5 * * *"                    # 14:55 JST
    - cron: "5,15,25,35,45,55 6 * * *"      # 15:05-15:55 JST
    - cron: "5,15,25,35,45,55 7 * * *"      # 16:05-16:55 JST
concurrency:
  group: lyra-bot  # one Lyra job at a time, so the state file never conflicts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests requests_oauthlib

      - name: Post the evening notice
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/lyra_evening.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Save the bot's state file back to the repo
        run: |
          git config user.name "dj-lyra-ai-bot"
          git config user.email "actions@github.com"
          git add data/lyra_state.json
          git diff --staged --quiet || git commit -m "Lyra bot: update state (evening)"
          # push even with nothing new: an earlier save inside the script may not have reached GitHub
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Email Dai if something crashed
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f lyra_notified.flag ] && exit 0  # the script already handled it (once-a-day email)
          # at most one of these emails per Japan-time day: skip if this workflow already failed today
          since=$(date -u -d "$(TZ=Asia/Tokyo date +%F) 00:00 +0900" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow lyra-evening.yml --status failure --created ">=$since" --json databaseId --jq length 2>/dev/null || echo 0)
          if [ "$n" != "0" ]; then echo "Already failed earlier today; not emailing again."; exit 0; fi
          python3 - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          a, pw = os.environ.get("GMAIL_ADDRESS"), os.environ.get("GMAIL_APP_PASSWORD")
          if a and pw:
              url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              m = MIMEText(f"GitHub Actionsの Lyra Evening Post が予期しないエラーで止まりました（このメールは1日1回まで）。\n\n実行ログ:\n{url}")
              m["Subject"], m["From"], m["To"] = "【DJ Lyra Ai】Lyra Evening Postが途中で止まりました", a, a
              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
                  s.login(a, pw)
                  s.send_message(m)
          PY
