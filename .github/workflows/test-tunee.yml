name: Test Tunee Generation

on:
  workflow_dispatch:

jobs:
  test-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout Tunee skill
        uses: actions/checkout@v4
        with:
          repository: tuneeai/free-music-generator
          path: tunee-skill

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tunee skill dependencies
        working-directory: tunee-skill
        run: pip install .

      - name: Generate ONE test track
        working-directory: tunee-skill
        env:
          TUNEE_API_KEY: ${{ secrets.TUNEE_API_KEY }}
        run: |
          python skills/free-music-generator/scripts/generate.py \
            --title "DJ Lyra Ai - Test Fragment 4" \
            --prompt "darkpsy, underground darkpsy label style, instrumental, 148 bpm, rolling bassline, fast driving kick, squelchy FM synth leads, organic atmospheric textures, psychedelic soundscapes, mysterious alien sound effects, hypnotic, nocturnal, aggressive, fast-paced" \
            --model mureka_v9 > ../gen_result.json
          echo "--- generate.py output ---"
          cat ../gen_result.json

      - name: Wait for generation to likely finish
        run: sleep 90

      - name: Fetch share page, extract mp3 URL, and download the actual file
        run: |
          python3 << 'PYEOF'
          import json, re, requests

          with open("gen_result.json") as f:
              gen_output = json.load(f)
          share_url = gen_output[0]["url"]
          print(f"Fetching share page: {share_url}")

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          resp = requests.get(share_url, timeout=30, headers=headers)
          print(f"Share page status: {resp.status_code}, length: {len(resp.text)} chars")

          mp3_urls = re.findall(r'https?://[^\s"\'\\]+\.mp3[^\s"\'\\]*', resp.text)
          if not mp3_urls:
              print("No mp3 URL found!")
              raise SystemExit(1)

          mp3_url = mp3_urls[0]
          print(f"\nDownloading: {mp3_url}")

          audio_resp = requests.get(mp3_url, timeout=60, headers=headers)
          print(f"Download status: {audio_resp.status_code}")
          print(f"Content-Type: {audio_resp.headers.get('Content-Type')}")
          print(f"Content-Length header: {audio_resp.headers.get('Content-Length')}")
          print(f"Actual bytes downloaded: {len(audio_resp.content)}")

          with open("test_track.mp3", "wb") as f:
              f.write(audio_resp.content)
          print("\nSaved to test_track.mp3 - checking it's a valid mp3 (first bytes):")
          print(audio_resp.content[:16])
          PYEOF

      - name: Upload downloaded file as artifact (so we can listen to it)
        uses: actions/upload-artifact@v4
        with:
          name: test-track
          path: test_track.mp3
