name: Publish Mix
on:
  workflow_dispatch:  # manual runs for testing
  schedule:
    - cron: "0 19 * * 5"  # Saturday 04:00 JST (19:00 UTC Friday)
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Check death mode
        id: death_check
        run: |
          DEAD=$(python -c "import json; print(json.load(open('docs/heartbeat.json'))['death_mode'])")
          echo "is_dead=$DEAD" >> "$GITHUB_OUTPUT"
          if [ "$DEAD" = "True" ]; then
            echo "::warning::Death mode is active. Skipping publish."
          fi

      - name: Set up Python
        if: steps.death_check.outputs.is_dead != 'True'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.death_check.outputs.is_dead != 'True'
        run: pip install requests requests_oauthlib
      - name: Publish newest unpublished mix (if any)
        if: steps.death_check.outputs.is_dead != 'True'
        id: publish
        run: python scripts/publish_mix.py
      - name: Commit updated mixes.json back to the repo
        if: steps.death_check.outputs.is_dead != 'True'
        run: |
          git config user.name "dj-lyra-ai-bot"
          git config user.email "actions@github.com"
          git add docs/mixes.json
          git diff --staged --quiet || git commit -m "Publish weekly mix"
          git push
      - name: Send notification (only sends email on failure)
        if: always() && steps.death_check.outputs.is_dead != 'True'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/notify.py
      - name: Post announcement to X
        if: steps.death_check.outputs.is_dead != 'True' && steps.publish.outputs.published == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python scripts/post_to_x.py "📡 This week's transmission is live. Have a beautiful weekend. The archive is always open - come find us anytime. 🛸✨
          https://eclipse-ai-studio.github.io/dj-lyra-ai-darkpsyradio/
          #DarkpsyRadio #AIDJ #Darkpsy"
