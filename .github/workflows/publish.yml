name: Publish Mix
on:
  workflow_dispatch:  # started by cron-job.org every Saturday 04:00 JST (and for manual runs)
  # GitHub's own timer was removed: it stopped starting workflows reliably
  # (2026-09-30〜). cron-job.org starts this instead. Don't add it back.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Check death mode
        id: death_check
        run: |
          DEAD=$(python -c "import json; print(json.load(open('docs/heartbeat.json'))['death_mode'])")
          echo "is_dead=$DEAD" >> "$GITHUB_OUTPUT"
          if [ "$DEAD" = "True" ]; then
            echo "::warning::Death mode is active. Skipping publish."
          fi

      - name: Set up Python
        if: steps.death_check.outputs.is_dead != 'True'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.death_check.outputs.is_dead != 'True'
        run: pip install requests requests_oauthlib
      - name: Publish newest unpublished mix (if any)
        if: steps.death_check.outputs.is_dead != 'True'
        id: publish
        run: python scripts/publish_mix.py
      - name: Commit updated mixes.json back to the repo
        if: steps.death_check.outputs.is_dead != 'True'
        run: |
          git config user.name "dj-lyra-ai-bot"
          git config user.email "actions@github.com"
          git add docs/mixes.json
          git diff --staged --quiet || git commit -m "Publish weekly mix"
          # Other bot jobs (Lyra posts/replies) may have pushed while this ran:
          # get their commits first, then push (retry a few times).
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))  # wait a bit longer each time (10s, 20s, 30s, 40s)
          done
          # tell notify.py this failed (otherwise it would still send the "OK" email)
          mkdir -p output
          python3 -c 'import json; open("output/pipeline_status.json","w").write(json.dumps({"stage":"mixes.jsonの保存","ok":False,"detail":"公開処理はできましたが、公開リスト(docs/mixes.json)をGitHubに保存できなかったため、サイトに反映されず、Xへの告知もしていません。Claudeに相談してください。"}, ensure_ascii=False))'
          exit 1
      - name: Send notification (only sends email on failure)
        if: always() && steps.death_check.outputs.is_dead != 'True'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/notify.py
      - name: Post announcement to X
        id: x_post
        if: steps.death_check.outputs.is_dead != 'True' && steps.publish.outputs.published == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          MSG="📡 This week's transmission is live. Have a beautiful weekend.
          The archive is always open - come find us anytime. 🛸✨
          https://eclipse-ai-studio.github.io/dj-lyra-ai-darkpsyradio/
          #DarkpsyRadio #AIDJ #Psytrance"
          # up to 3 tries, 1 minute apart. If X says "duplicate", an earlier try did go out: that counts as done.
          for i in 1 2 3; do
            OUT=$(python scripts/post_to_x.py "$MSG" 2>&1) && { echo "$OUT"; exit 0; }
            echo "$OUT"
            if echo "$OUT" | grep -qi "duplicate"; then echo "Already posted (duplicate). Done."; exit 0; fi
            [ "$i" -lt 3 ] && sleep 60
          done
          exit 1
      - name: Email Dai if the X announcement failed
        if: always() && steps.x_post.outcome == 'failure'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          a, pw = os.environ.get("GMAIL_ADDRESS"), os.environ.get("GMAIL_APP_PASSWORD")
          if a and pw:
              url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              m = MIMEText("今週のミックスは公開できましたが、Xへの告知の投稿に失敗した可能性があります。\n"
                           "Xを確認して、出ていなければ手動で告知してください。\n\n実行ログ:\n" + url)
              m["Subject"], m["From"], m["To"] = "【DJ Lyra Ai】ミックス公開のX告知に失敗しました", a, a
              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
                  s.login(a, pw)
                  s.send_message(m)
          PY
