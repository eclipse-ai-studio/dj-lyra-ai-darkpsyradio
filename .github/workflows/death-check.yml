name: Death Check

on:
  schedule:
    - cron: "0 0 * * 0"  # 毎週日曜 00:00 UTC = 09:00 JST
  workflow_dispatch:  # 手動実行でもテストできるように

permissions:
  contents: write

jobs:
  check-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests requests_oauthlib

      - name: Run heartbeat check
        id: heartbeat
        run: python scripts/check_heartbeat.py

      - name: Commit updated heartbeat.json back to the repo
        run: |
          git config user.name "dj-lyra-ai-bot"
          git config user.email "actions@github.com"
          git add docs/heartbeat.json
          git diff --staged --quiet || git commit -m "Update heartbeat status"
          git push

      - name: Notify the Doctor of heartbeat status
        if: steps.heartbeat.outputs.missed_weeks != '0'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/notify_heartbeat.py "${{ steps.heartbeat.outputs.missed_weeks }}" "${{ steps.heartbeat.outputs.newly_dead }}"

      - name: Post final announcement to X
        if: steps.heartbeat.outputs.newly_dead == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python scripts/post_to_x.py "📡 Transmission ends here.
          This message is posted automatically upon the creator's death.
          No new mixes will follow. Thank you for listening.
          The archive remains open, forever. 🛸
          https://dj-lyra-ai-darkpsyradio.github.io/dj-lyra-ai-darkpsyradio/"
