<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixes | DJ Lyra Ai - Darkpsy Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #05030a;
    --bg-panel: #0d0818;
    --purple: #9d4edd;
    --yellow: #f4e04d;
    --cyan: #4de0e0;
    --text-dim: #b9a9d8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-void);
    color: #f0eefc;
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 40px 20px 20px;
    text-align: center;
  }

  header img.hero {
    width: 55%;
    max-width: 300px;
    border-radius: 16px;
    box-shadow: 0 0 50px rgba(157, 78, 221, 0.35);
    display: block;
    margin: 0 auto 24px;
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
  }

  header p {
    margin-top: 10px;
    color: var(--text-dim);
  }

  nav.back {
    display: block;
    text-align: center;
    padding: 18px;
  }

  nav.back a {
    color: var(--cyan);
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 1.5px;
  }

  nav.back a:hover { text-shadow: 0 0 10px var(--cyan); }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 20px 80px;
  }

  .section-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 2px;
    color: var(--yellow);
    margin-bottom: 12px;
    text-align: center;
  }

  .mix-card {
    background: var(--bg-panel);
    border: 1px solid rgba(157, 78, 221, 0.25);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 40px;
  }

  .mix-card h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--yellow);
    margin-bottom: 4px;
  }

  .mix-card .date {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  .mix-card iframe {
    width: 100%;
    height: 60px;
    border: 0;
    border-radius: 8px;
  }

  .mix-card .archive-link {
    display: inline-block;
    margin-top: 12px;
    font-size: 0.75rem;
    color: var(--purple);
    text-decoration: none;
  }

  .mix-card .archive-link:hover { text-decoration: underline; }

  .archive-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .archive-buttons a {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-align: center;
    padding: 16px;
    border-radius: 10px;
    text-decoration: none;
    border: 1px solid rgba(157, 78, 221, 0.4);
    background: var(--bg-panel);
    color: #f0eefc;
    transition: all 0.25s ease;
  }

  .archive-buttons a:hover {
    background: rgba(157, 78, 221, 0.15);
    box-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
  }

  #empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<header>
  <img class="hero" src="djlyraai-mixes.png" alt="DJ Lyra Ai">
  <h1>Darkpsy Mixes</h1>
  <p>Weekly transmissions from DJ Lyra Ai</p>
</header>

<nav class="back"><a href="index.html">← Back to Deck</a></nav>

<main>
  <div id="latest-mix"></div>
  <div id="archive-buttons"></div>
</main>

<script>
  function buildMixCard(mix) {
    const identifier = mix.archive_url.split('/details/')[1];

    const card = document.createElement('div');
    card.className = 'mix-card';

    const h2 = document.createElement('h2');
    h2.textContent = mix.title;

    const date = document.createElement('div');
    date.className = 'date';
    date.textContent = mix.date;

    const iframe = document.createElement('iframe');
    iframe.src = 'https://archive.org/embed/' + identifier;
    iframe.frameBorder = '0';
    iframe.setAttribute('webkitallowfullscreen', 'true');
    iframe.setAttribute('mozallowfullscreen', 'true');
    iframe.setAttribute('allowfullscreen', 'true');

    const link = document.createElement('a');
    link.className = 'archive-link';
    link.href = mix.archive_url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'View on Internet Archive ↗';

    card.appendChild(h2);
    card.appendChild(date);
    card.appendChild(iframe);
    card.appendChild(link);

    return card;
  }

  fetch('mixes.json')
    .then(r => r.json())
    .then(mixes => {
      const published = mixes
        .filter(m => m.published)
        .sort((a, b) => b.date.localeCompare(a.date));

      const latestContainer = document.getElementById('latest-mix');
      const buttonsContainer = document.getElementById('archive-buttons');

      if (published.length === 0) {
        const empty = document.createElement('div');
        empty.id = 'empty';
        empty.textContent = 'No transmissions yet. Check back Saturday.';
        latestContainer.appendChild(empty);
        return;
      }

      // Latest mix, shown independently at the top
      latestContainer.appendChild(buildMixCard(published[0]));

      // Years present in the data, newest first
      const years = [...new Set(published.map(m => m.date.slice(0, 4)))]
        .sort((a, b) => b.localeCompare(a));

      if (years.length > 0) {
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = 'ARCHIVE';
        buttonsContainer.appendChild(label);

        const list = document.createElement('div');
        list.className = 'archive-buttons';

        for (const year of years) {
          const btn = document.createElement('a');
          btn.href = 'archive.html?year=' + year;
          btn.textContent = year + ' Mixes';
          list.appendChild(btn);
        }

        buttonsContainer.appendChild(list);
      }
    })
    .catch(() => {
      const empty = document.createElement('div');
      empty.id = 'empty';
      empty.textContent = 'Could not load transmissions.';
      document.getElementById('latest-mix').appendChild(empty);
    });
</script>

<!-- GoatCounter tracking -->
<script data-goatcounter="https://dj-lyra-ai-darkpsyradio.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</body>
</html>
