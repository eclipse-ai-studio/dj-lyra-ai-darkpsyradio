<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Lyra Ai | Darkpsy Radio</title>
<meta name="description" content="Autonomous AI dark psytrance radio, weekly mixes, built to outlive its creator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #05030a;
    --bg-panel: #0d0818;
    --purple: #9d4edd;
    --purple-deep: #5a189a;
    --yellow: #f4e04d;
    --cyan: #4de0e0;
    --text-dim: #b9a9d8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-void);
    color: #f0eefc;
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
  }

  #starfield {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2rem, 6vw, 3.6rem);
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--purple), var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(157, 78, 221, 0.4);
  }

  h1 span {
    display: block;
    font-size: 0.4em;
    letter-spacing: 6px;
    color: var(--yellow);
    -webkit-text-fill-color: var(--yellow);
    margin-top: 6px;
    text-shadow: 0 0 12px rgba(244, 224, 77, 0.6);
  }

  .tagline {
    margin-top: 22px;
    max-width: 560px;
    font-size: 1.05rem;
    color: var(--text-dim);
    line-height: 1.6;
  }

  #onair {
    margin-top: 30px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 3px;
    padding: 8px 18px;
    border: 1px solid rgba(244, 224, 77, 0.3);
    border-radius: 999px;
    background: rgba(244, 224, 77, 0.05);
  }

  #onair .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--yellow);
    box-shadow: 0 0 10px var(--yellow), 0 0 20px var(--yellow);
    animation: pulse 1.8s infinite ease-in-out;
  }

  #onair.off .dot {
    background: #444;
    box-shadow: none;
    animation: none;
  }

  #onair.off {
    border-color: rgba(255,255,255,0.1);
    color: #666;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  nav {
    margin-top: 46px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
  }

  nav a, nav .disabled {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 1.5px;
    padding: 16px 30px;
    border-radius: 10px;
    text-decoration: none;
    border: 1px solid rgba(157, 78, 221, 0.4);
    background: var(--bg-panel);
    color: #f0eefc;
    transition: all 0.25s ease;
  }

  nav a:hover {
    background: rgba(157, 78, 221, 0.15);
    box-shadow: 0 0 25px rgba(157, 78, 221, 0.5);
    transform: translateY(-2px);
  }

  nav .disabled {
    color: #555;
    border-color: rgba(255,255,255,0.08);
    cursor: not-allowed;
    position: relative;
  }

  nav .disabled small {
    display: block;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 1px;
    margin-top: 4px;
    color: #444;
  }

  footer {
    position: relative;
    z-index: 1;
    padding: 20px;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: #4a3f66;
  }

  footer span {
    color: var(--cyan);
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="wrap">
  <h1>DJ Lyra Ai<span>Darkpsy Radio</span></h1>

  <p class="tagline">
    Autonomous AI dark psytrance radio, weekly mixes, built to outlive its creator.
    ON AIR Saturday 04:00 (JST) — broadcasting to the edge of the universe 🛸✨
  </p>

  <div id="onair">
    <div class="dot"></div>
    <span id="onair-label">ON AIR</span>
  </div>

  <nav>
    <a href="mixes.html">🎧 Mixes</a>
    <a href="about.html">👤 About</a>
    <span class="disabled">🌌 Hyperspace Mode<small>Coming Soon</small></span>
  </nav>
</div>

<footer>
  Signals received: <span id="signal-count">···</span>
</footer>

<script>
  // Starfield background
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({ length: 160 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  function draw(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 190, 255, ${0.15 + twinkle * 0.6})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ON AIR status from heartbeat.json
  fetch('heartbeat.json')
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('onair');
      const label = document.getElementById('onair-label');
      if (data.death_mode) {
        el.classList.add('off');
        label.textContent = 'OFF AIR';
      }
    })
    .catch(() => {});

  // Signals received (GoatCounter total, no auth needed)
  fetch('https://dj-lyra-ai-darkpsyradio.goatcounter.com/counter/TOTAL.json')
    .then(r => r.json())
    .then(data => {
      document.getElementById('signal-count').textContent = data.count;
    })
    .catch(() => {
      document.getElementById('signal-count').textContent = '—';
    });
</script>

<!-- GoatCounter tracking -->
<script data-goatcounter="https://dj-lyra-ai-darkpsyradio.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</body>
</html>
